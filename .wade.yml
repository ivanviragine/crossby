version: 2
project:
  main_branch: main
  issue_label: feature-plan
  worktrees_dir: ../.worktrees
  branch_prefix: feat
  merge_strategy: PR
ai:
  default_tool: codex
  default_model: gpt-6.1-sol
  effort: high
  permission_mode: yolo
  plan:
    tool: codex
    model: gpt-6.1-sol
    effort: high
  deps:
    mode: headless
    timeout: 900
    tool: codex
    model: gpt-6.1-sol
    effort: high
  review_plan:
    tool: codex
    model: gpt-6.1-sol
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_implementation:
    tool: codex
    model: gpt-6.1-sol
    mode: headless
    effort: high
    enabled: true
    timeout: 900
  review_batch:
    mode: interactive
    enabled: true
    tool: codex
    model: gpt-6.1-sol
    effort: high
  review_pr_comments:
    enabled: true
    tool: codex
    model: gpt-6.1-sol
    effort: high
models:
  codex:
    easy:
      model: gpt-6.1-sol
      effort: high
    medium:
      model: gpt-6.1-sol
      effort: high
    complex:
      model: gpt-6.1-sol
      effort: high
    very_complex:
      model: gpt-6.1-sol
      effort: high
provider:
  name: github
bot_review:
  auto_trigger: true
  arrival_timeout: 900
  ack_timeout: 900
  bots:
  - name: coderabbit
    trigger: '@coderabbitai review'
    enabled: true
  - name: codex
    trigger: '@codex review'
    enabled: true
hooks:
  post_worktree_create: scripts/setup-worktree.sh
  copy_to_worktree:
  - .env
  - .wade.yml
knowledge:
  enabled: true
  path: KNOWLEDGE.md
done:
  max_review_passes: 10
