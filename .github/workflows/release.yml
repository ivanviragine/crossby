name: Create Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Published (not draft) on purpose. A draft release never fires the
      # `release: [published]` event, which is what stranded v0.12.1-v0.12.3 as
      # drafts while PyPI stayed on 0.12.0.
      #
      # publish.yml does NOT rely on this release firing an event: GitHub
      # deliberately does not trigger workflows from events raised with
      # secrets.GITHUB_TOKEN, so a release created here can never start another
      # workflow run. publish.yml keys off the same tag push instead.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
