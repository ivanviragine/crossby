name: Publish to PyPI

# Tag push is the primary trigger, and it deliberately does NOT depend on
# release.yml creating a GitHub Release first: GitHub does not trigger
# workflows from events raised with secrets.GITHUB_TOKEN, so a release created
# by Actions cannot start this workflow. Keying off the tag directly keeps the
# two workflows independent — release.yml writes the notes, this one ships the
# artifact.
#
# `release: [published]` is kept as a manual escape hatch so publishing an
# existing release from the UI (or `gh release edit --draft=false`) still ships
# that tag.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # Never let a tag push and a manual publish of the same tag race into two
  # concurrent uploads. Both events carry the same tag ref, so this serialises
  # them; it does not deduplicate them — see `skip-existing` below.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Both triggers above fire for the same tag, so whichever runs second
          # would hit an already-uploaded version and fail a release that in
          # fact succeeded. Skipping the duplicate keeps the escape hatch
          # usable; the version itself is pinned by the tag, so a re-upload can
          # only ever be the same artifact.
          skip-existing: true
