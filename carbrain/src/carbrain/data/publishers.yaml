# Who publishes information about cars: specialist media and creators (influencers).
#
# A publisher is an organization or person; each has channels on platforms
# (website, rss, youtube, instagram, tiktok). The platform decides which fetcher
# and which rights entry (sources.yaml) apply:
#   rss -> publisher_feeds    youtube -> youtube    instagram -> instagram
#
# Channel `status`, weakest to strongest:
#   unverified     no evidence yet
#   web_evidence   seen in a dated third-party source (see `evidence`); may be stale
#   feed_verified  the feed was fetched and parsed successfully on `checked_on`
#   api_verified   confirmed through the platform's official API (`carbrain catalog verify`)
# Evidence dates matter: several handles come from a January 2023 ranking.
#
# `focus` vocabulary: reviews, comparisons, buying_advice, news, instrumented_tests,
#   long_term_tests, used_cars, ev, mechanics, motorsport, entertainment, customization,
#   auctions, classics, market
# `evidence_kind` (how to weigh what they say): measured_tests, expert_opinion, news,
#   owner_experience, entertainment

evidence:
  chaves_na_mao_2023: &cnm
    url: https://www.chavesnamao.com.br/noticias-automotivas/top-50-influenciadores-do-mercado-automotivo-no-brasil/
    dated: 2023-01-27
  hypeauditor_2022: &hype
    url: https://hypeauditor.com/top-youtube-autos-vehicles-brazil/
    dated: 2022-09-01
  doutor_multas: &dm
    url: https://doutormultas.com.br/canais-youtube-carros/
    dated: null
  search_2026: &s26
    url: web search results (2026-09-27)
    dated: 2026-09-27

