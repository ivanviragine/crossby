  publisher_feeds:
    name: Specialist media RSS/Atom feeds (see publishers.yaml)
    type: specialist_media
    url: https://quatrorodas.abril.com.br/feed/
    cadence: daily
    freshness_days: 3
    license: Public syndication feeds; article text is copyrighted (Lei 9.610/98)
    attribution: "Fonte: the publisher named on each item"
    evidence: Feeds are published for syndication; only metadata is kept
    rights:
      collect: conditional
      retain_history: conditional
      embed: conditional
      ai_processing: conditional
      display_excerpts: conditional
      publish_derived: conditional
    conditions:
      collect: Title, link, date and categories only; never store article text.
      retain_history: Metadata only.
      embed: Headlines only.
      ai_processing: Headlines only.
      display_excerpts: Headline, publisher and a link to the original only.
      publish_derived: Link to the original; never reproduce article text.

