# Source registry and usage rights.
#
# Every use of a source's data needs its own permission:
#   collect, retain_history, embed, ai_processing, display_excerpts, publish_derived
# Status values: allowed | conditional | pending | denied.
# `type` groups sources by what they are: official_statistics, vehicle_registry,
# industry_association, lab_testing, price_reference, specialist_media,
# specialist_database, social_platform, consumer_complaints, marketplace, commercial_data.
#   conditional = allowed under the text in `conditions`
#   pending     = not confirmed yet; treated as NOT allowed
# Update a status only with written evidence (license text, contract, approval email)
# and record it in `evidence`.

sources:
  bcb_sgs:
    name: Banco Central do Brasil — SGS
    type: official_statistics
    url: https://api.bcb.gov.br
    cadence: monthly
    freshness_days: 70
    license: Open data (dadosabertos.bcb.gov.br)
    attribution: "Fonte: Banco Central do Brasil, SGS"
    evidence: Public API and open data portal
    rights:
      collect: allowed
      retain_history: allowed
      embed: allowed
      ai_processing: allowed
      display_excerpts: allowed
      publish_derived: allowed

