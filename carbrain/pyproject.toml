[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "carbrain"
version = "0.1.0"
description = "Versioned evidence database about the Brazilian car market, with a cited chatbot tool layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rapidfuzz>=3.6",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
chat = ["anthropic>=0.60"]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML>=6.0",
    "types-defusedxml>=0.7",
]

[project.scripts]
carbrain = "carbrain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/carbrain"]

[tool.ruff]
target-version = "py311"
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl.*", "rapidfuzz.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q -m \"not live\""
markers = ["live: hits real data sources over the network (run with -m live)"]
